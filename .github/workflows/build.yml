name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-tests:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax-check every source
        run: ./tests/check.sh

      - name: Run logic tests
        # Timing based; retry once in case the runner was busy
        run: ./tests/run.sh || ./tests/run.sh

  build:
    name: Build DLLs (MSYS2 MINGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags, so `git describe` works for the version

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # MINGW64 (msvcrt) is kept on purpose: its DLLs run on older Windows
          # versions where the UCRT may be missing.
          suppress-deprecation-warnings: msystem-mingw64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja

      - name: Check the tag matches the Meson version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          meson_ver=$(sed -n "s/^project(.*version: '\([0-9][0-9.]*\)'.*/\1/p" meson.build | head -n 1)
          if [ "v${meson_ver}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the version in meson.build (v${meson_ver})."
            echo "Update the version in meson.build, commit, and tag again."
            exit 1
          fi

      - name: Build
        run: |
          git config --global --add safe.directory '*'
          # The checkout was made by another git; refresh the index so
          # `git describe --dirty` does not report a clean tree as dirty.
          git update-index -q --refresh || true
          echo "version string: $(git describe --always --dirty --tags)"
          ./build.sh

      - name: Checksums
        run: |
          cd dist
          find . -name bngrw.dll | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BanaTap-dlls
          path: dist
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [logic-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BanaTap-dlls
          path: dist

      - name: Package
        run: |
          (cd dist && zip -r "../BanaTap-${GITHUB_REF_NAME}.zip" .)
          sha256sum "BanaTap-${GITHUB_REF_NAME}.zip" > "BanaTap-${GITHUB_REF_NAME}.zip.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            BanaTap-${{ github.ref_name }}.zip
            BanaTap-${{ github.ref_name }}.zip.sha256
          generate_release_notes: true
